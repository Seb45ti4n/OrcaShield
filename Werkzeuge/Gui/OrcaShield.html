<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; object-src 'none'; media-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<title>OrcaShield</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 18' shape-rendering='crispEdges'%3E%3Cpath fill='%23e9f3ff' d='M14 2h2v1H14zM15 3h3v1H15zM15 4h4v1H15zM16 5h3v1H16zM14 6h10v1H14zM3 7h1v1H3zM10 7h18v1H10zM4 8h1v1H4zM8 8h22v1H8zM5 9h26v1H5zM5 10h27v1H5zM5 11h27v1H5zM5 12h2v1H5zM8 12h22v1H8zM4 13h2v1H4zM13 13h14v1H13zM3 14h2v1H3z'/%3E%3Cpath fill='%234cc3ff' d='M30 11h2v1H30zM13 12h17v1H13zM17 13h10v1H17zM25 8h3v1H25zM24 9h3v1H24zM29 10h1v1H29z'/%3E%3C/svg%3E">
<style>
/* ==============================================================
   OrcaShield – GUI-Entwurf 2
   Ruhig: wenig Etiketten, viel Luft. Details erst beim Aufklappen.
   Farben als Variablen; Dunkel ist Vorgabe.
   ============================================================== */
:root {
  --akzent: #4cc3ff;
  --gruen: #46c98b;
  --gelb: #e2b046;
  --rot: #e5675f;
  --radius: 14px;
  --abstand: 16px;
  --schrift: 15px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
  --dauer: .22s;
}
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0d10;
  --flaeche: #121519;
  --flaeche-2: #171b20;
  --flaeche-3: #1d2228;
  --linie: #252a31;
  --linie-2: #30363e;
  --text: #e6eaef;
  --leise: #8b949e;
  --sehrleise: #5d6670;
  --schatten: 0 18px 50px rgba(0, 0, 0, .55);
  --welle: rgba(76, 195, 255, .05);
  --orca-koerper: #05070a;
  --orca-weiss: #e9f3ff;
  --orca-glanz: #1d2b38;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    color-scheme: light;
    --bg: #d9e0e8; --flaeche: #e7ecf2; --flaeche-2: #e0e6ed; --flaeche-3: #d4dce5;
    --linie: #c4ceda; --linie-2: #b2bdca; --text: #132131; --leise: #4d5b6a; --sehrleise: #788695;
    --schatten: 0 14px 40px rgba(20, 30, 40, .14); --welle: rgba(30, 120, 200, .06);
    --orca-koerper: #0b0d10; --orca-weiss: #ffffff; --orca-glanz: #3a4552;
  }
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #0b0d10; --flaeche: #121519; --flaeche-2: #171b20; --flaeche-3: #1d2228;
    --linie: #252a31; --linie-2: #30363e; --text: #e6eaef; --leise: #8b949e; --sehrleise: #5d6670;
    --schatten: 0 18px 50px rgba(0, 0, 0, .55); --welle: rgba(76, 195, 255, .05);
    --orca-koerper: #05070a; --orca-weiss: #e9f3ff; --orca-glanz: #1d2b38;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #d9e0e8; --flaeche: #e7ecf2; --flaeche-2: #e0e6ed; --flaeche-3: #d4dce5;
  --linie: #c4ceda; --linie-2: #b2bdca; --text: #132131; --leise: #4d5b6a; --sehrleise: #788695;
  --schatten: 0 14px 40px rgba(20, 30, 40, .14); --welle: rgba(30, 120, 200, .06);
  --orca-koerper: #0b0d10; --orca-weiss: #ffffff; --orca-glanz: #3a4552;
}
:root[data-dichte="kompakt"] { --abstand: 10px; }
:root[data-dichte="luftig"]  { --abstand: 24px; }
:root[data-ecken="eckig"]    { --radius: 4px; }
:root[data-ecken="rund"]     { --radius: 22px; }
:root[data-bewegung="aus"]   { --dauer: 0s; }
:root[data-bewegung="aus"] *, :root[data-bewegung="aus"] *::before, :root[data-bewegung="aus"] *::after { animation: none !important; }

* { box-sizing: border-box; }
html, body { height: 100%; }
/* Rollbalken: schmal, abgerundet, in den Farben des Themas, ohne Pfeile -
   wie bei iOS erst deutlich, wenn man ihn braucht. (Die Standard-Eigenschaften
   scrollbar-width/-color würden diese Regeln in Chromium überstimmen und sind
   deshalb nirgends gesetzt.) */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--linie-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--sehrleise); background-clip: padding-box; }
::-webkit-scrollbar-button { display: none; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--schrift)/1.55 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
/* Eigener Look (G11, behutsam): Tiefe wie unter Wasser - oben fällt ein schwaches
   Licht in der Akzentfarbe ein, nach unten wird es dunkler. Grau/Schwarz bleiben. */
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(1100px 520px at 72% -12%, color-mix(in srgb, var(--akzent) 9%, transparent), transparent 62%),
              linear-gradient(180deg, transparent 55%, color-mix(in srgb, #000 22%, transparent)); }
:root[data-theme="light"] body::before { background: radial-gradient(1100px 520px at 72% -12%, color-mix(in srgb, var(--akzent) 14%, transparent), transparent 62%); }
h1, h2 { letter-spacing: .2px; }
button, input, select { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--akzent) 35%, transparent); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--akzent) 70%, transparent); outline-offset: 2px; }
.leise { color: var(--leise); }
.mono { font-family: var(--mono); }

/* --- Meer im Hintergrund, mit gelegentlicher Flosse ------------------ */
.meer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.meer svg.welle { position: absolute; left: 0; bottom: -2px; width: 200%; height: 170px; animation: wogen 40s linear infinite; }
:root[data-wellen="aus"] .meer svg { display: none; }
@keyframes wogen { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.flosse-weit { position: absolute; bottom: 92px; left: -40px; width: 22px; opacity: 0; animation: vorbei 210s linear infinite 25s; }
@keyframes vorbei { 0% { left: -40px; opacity: 0; } 1% { opacity: .5; } 7% { left: 105%; opacity: .5; } 7.1%, 100% { left: 105%; opacity: 0; } }

/* --- Gerüst --------------------------------------------------------- */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 264px 1fr; height: 100vh; }
.nav { border-right: 1px solid var(--linie); background: color-mix(in srgb, var(--flaeche) 92%, transparent); display: flex; flex-direction: column; min-height: 0; }
.marke { display: flex; align-items: center; gap: 12px; padding: 20px 18px 12px; cursor: default; user-select: none; }
.marke .orca { width: 78px; height: 41px; flex: none; position: relative; }
.marke .orca svg { width: 100%; height: 100%; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--akzent) 55%, transparent)) drop-shadow(0 0 16px color-mix(in srgb, var(--akzent) 22%, transparent)); }
.marke b { font: 700 19px/1 var(--font-display); letter-spacing: .3px; }
.marke small { display: block; color: var(--sehrleise); font-size: 11.5px; margin-top: 5px; letter-spacing: .2px; }
.auge { transition: opacity .08s; }
.marke:hover .auge { animation: blinzeln 3.2s infinite; }
@keyframes blinzeln { 0%, 92%, 100% { opacity: 1; } 95% { opacity: 0; } }
.fontaene { position: absolute; left: 58px; top: -6px; width: 6px; height: 10px; opacity: 0; }
.marke:hover .fontaene { animation: pusten 1.6s ease-out 1; }
.fontaene i { position: absolute; width: 2px; height: 2px; background: var(--akzent); }
@keyframes pusten { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
.orca.sprung svg { animation: sprung 1.4s ease-in-out 1; }
/* Kleiner Orca-Moment bei jeder Änderung: kurzer Hüpfer mit Fontäne */
.orca.hopser svg { animation: hopser .7s ease-out 1; }
.orca.hopser .fontaene, .orca.sprung .fontaene { animation: pusten 1.3s ease-out 1; }
@keyframes hopser { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-4px) rotate(-4deg); } }
@keyframes sprung { 0%, 100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-9px) rotate(-8deg); } 70% { transform: translateY(1px) rotate(4deg); } }

.ring-box { margin: 6px 14px 10px; padding: 16px; border: 1px solid var(--linie); border-radius: var(--radius); background: var(--flaeche-2); display: flex; gap: 16px; align-items: center; cursor: pointer; transition: border-color var(--dauer); }
.ring-box:hover { border-color: var(--linie-2); }
.ring { --p: 0; width: 68px; height: 68px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--akzent) calc(var(--p) * 1%), var(--flaeche-3) 0); }
.ring > span { width: 54px; height: 54px; border-radius: 50%; background: var(--flaeche-2); display: grid; place-items: center; font: 700 15px var(--font-display); }
.ring .spitze { position: absolute; inset: 0; transform: rotate(calc(var(--p) * 3.6deg)); pointer-events: none; }
.ring .spitze::before { content: ""; position: absolute; left: 50%; top: -3px; width: 0; height: 0; translate: -50% 0;
  border-left: 3px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid var(--akzent); }
.ring-box .zeilen { font-size: 13px; color: var(--leise); line-height: 1.5; }
.ring-box .zeilen b { color: var(--text); font-weight: 600; }

.nav-scroll { overflow: auto; padding: 4px 10px 12px; flex: 1; min-height: 0; }
.nav h4 { margin: 16px 10px 6px; font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--sehrleise); font-weight: 600; }
.nav-punkt { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--leise); transition: background var(--dauer), color var(--dauer); }
.nav-punkt:hover { background: var(--flaeche-3); color: var(--text); }
.nav-punkt.an { background: color-mix(in srgb, var(--akzent) 13%, transparent); color: var(--text); }
.nav-punkt .ico { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav-punkt.an .ico { color: var(--akzent); opacity: 1; }
.nav-punkt .lbl { flex: 1; font-size: 13.8px; }
.nav-punkt .zahl { font-size: 11.5px; color: var(--sehrleise); font-variant-numeric: tabular-nums; }
.nav-punkt .zahl.offen::before { content: "● "; color: var(--gelb); font-size: 8px; vertical-align: 2px; }
.nav-fuss { padding: 12px; border-top: 1px solid var(--linie); display: flex; flex-direction: column; gap: 10px; }
.sendet-nichts { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--sehrleise); cursor: pointer; border: 0; background: none; padding: 0 2px; text-align: left; }
.sendet-nichts svg { width: 14px; height: 14px; color: var(--gruen); flex: none; }
.sendet-nichts:hover { color: var(--leise); }

/* --- Kopf ------------------------------------------------------------ */
.haupt { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.kopf { padding: 14px 32px 14px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid var(--linie); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(12px); position: relative; z-index: 5; }
.kopf-oben { display: flex; align-items: center; gap: 10px; }
.kopf-zeile { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.kopf h1 { margin: 0; font: 650 25px/1.15 var(--font-display); letter-spacing: .2px; flex: 1; min-width: 220px; }
.kopf h1 small { display: block; font: 400 13px var(--font); color: var(--leise); margin-top: 6px; letter-spacing: 0; }
.suche { position: relative; flex: 0 1 340px; min-width: 200px; }
.suche input { width: 100%; padding: 9px 14px 9px 36px; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche); outline: none; transition: border-color var(--dauer); }
.suche input:focus { border-color: color-mix(in srgb, var(--akzent) 60%, var(--linie)); }
.suche svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 15px; color: var(--sehrleise); }
.suche kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 11px var(--mono); color: var(--sehrleise); border: 1px solid var(--linie); border-radius: 5px; padding: 0 6px; }
.platscher { position: absolute; right: 40px; top: 4px; pointer-events: none; }
.platscher i { position: absolute; width: 3px; height: 3px; background: var(--akzent); border-radius: 1px; animation: tropfen .9s ease-out forwards; }
@keyframes tropfen { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

.klein-knopf { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 9px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; color: var(--leise); display: inline-flex; align-items: center; gap: 7px; transition: all var(--dauer); }
.klein-knopf:hover { color: var(--text); border-color: var(--linie-2); }
.klein-knopf svg { width: 14px; height: 14px; }
.verlauf-wrap { position: relative; }
.verlauf-drop { position: absolute; top: calc(100% + 8px); left: 0; width: min(440px, 80vw); background: var(--flaeche-2); border: 1px solid var(--linie-2); border-radius: 12px; box-shadow: var(--schatten); display: none; z-index: 20; overflow: hidden; }
.verlauf-drop.auf { display: block; }
.verlauf-drop .kopfzeile { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px 14px; border-bottom: 1px solid var(--linie); font-size: 12.5px; color: var(--leise); }
.verlauf-drop .liste { max-height: 320px; overflow: auto; }
.v-zeile { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 14px; font-size: 12.5px; border-bottom: 1px solid color-mix(in srgb, var(--linie) 60%, transparent); }
.v-zeile:last-child { border-bottom: 0; }
.v-zeile time { color: var(--sehrleise); font-variant-numeric: tabular-nums; }
.v-zeile .t { color: var(--leise); }
.v-zeile .t b { color: var(--text); font-weight: 600; margin-right: 6px; }
.v-zeile.warn .t b { color: var(--gelb); }
.v-zeile.fehler .t b { color: var(--rot); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid transparent; background: none; border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--leise); transition: all var(--dauer); white-space: nowrap; }
.chip:hover { color: var(--text); background: var(--flaeche-2); }
.chip.an { color: var(--text); background: var(--flaeche-3); border-color: var(--linie-2); }
.chip .n { color: var(--sehrleise); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip .punkt { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.knopf { border: 1px solid var(--linie-2); background: var(--flaeche-3); border-radius: 10px; padding: 8px 15px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all var(--dauer); display: inline-flex; align-items: center; gap: 8px; }
.knopf:hover { border-color: color-mix(in srgb, var(--akzent) 55%, var(--linie-2)); }
.knopf.voll { background: var(--akzent); color: #041018; border-color: var(--akzent); }
.knopf.voll:hover { filter: brightness(1.07); }
.knopf.gefahr { color: var(--rot); border-color: color-mix(in srgb, var(--rot) 45%, transparent); background: transparent; }
.knopf.still { background: transparent; }
.knopf svg { width: 15px; height: 15px; }

.inhalt { overflow: auto; flex: 1; padding: 28px 32px 140px;
  /* Zum unteren Rand hin leicht durchscheinend: fest am Fenster, die Kacheln
     werden beim Scrollen unten weicher und die Wellen schimmern durch. */
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 170px), rgba(0, 0, 0, .55) 100%);
          mask-image: linear-gradient(to bottom, #000 calc(100% - 170px), rgba(0, 0, 0, .55) 100%); }
:root[data-wellen="aus"] .inhalt { -webkit-mask-image: none; mask-image: none; }
.breite { max-width: 1600px; }

/* --- Dashboard ------------------------------------------------------- */
.hinweis-band { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border: 1px solid var(--linie); border-left: 3px solid var(--gelb); border-radius: 10px; background: var(--flaeche); margin-bottom: 26px; font-size: 13.5px; color: var(--leise); }
.hinweis-band b { color: var(--text); font-weight: 600; }
.abschnitt { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
.abschnitt h2 { margin: 0; font: 600 16px var(--font-display); }
.abschnitt .leise { font-size: 12.5px; }
.legende { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--sehrleise); margin: -6px 0 18px; }
.legende i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.dash { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(250px, calc((100% - (var(--spalten-kat, 4) - 1) * (var(--abstand) + 2px)) / var(--spalten-kat, 4))), 1fr)); gap: calc(var(--abstand) + 2px); }
.kachel-k { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color var(--dauer); }
.kachel-k:hover { border-color: var(--linie-2); }
.kachel-k .oben { display: flex; align-items: center; gap: 10px; }
.kachel-k .oben .ico { width: 18px; height: 18px; color: var(--leise); flex: none; }
.kachel-k .oben b { font-weight: 600; font-size: 14.5px; flex: 1; }
.kachel-k .oben .zahl { font-size: 12px; color: var(--sehrleise); font-variant-numeric: tabular-nums; }
.kachel-k p { margin: 0; font-size: 13px; color: var(--leise); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; cursor: pointer; }
.kachel-k.auf p { -webkit-line-clamp: unset; display: block; color: var(--text); }
.kachel-k .oben { cursor: pointer; }
@container (max-width: 220px) { .kachel-k { padding: 14px 13px 13px; gap: 10px; } .kachel-k .oben b { font-size: 13.5px; } }
.balken { height: 3px; background: var(--flaeche-3); border-radius: 3px; overflow: hidden; }
.balken i { display: block; height: 100%; background: var(--akzent); opacity: .8; border-radius: 3px; transition: width .4s; }
.stufen { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--flaeche-2); border: 1px solid var(--linie); border-radius: 10px; padding: 3px; gap: 3px; }
.stufen button { border: 0; background: none; padding: 6px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--leise); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all var(--dauer); }
.stufen button:hover { color: var(--text); background: var(--flaeche-3); }
.stufen button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.stufen button.an { background: var(--flaeche-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--linie-2); }
.stufen button.an[data-s="gruen"] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gruen) 55%, transparent); }
.stufen button.an[data-s="gelb"] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gelb) 55%, transparent); }
.stufen button.an[data-s="rot"] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rot) 55%, transparent); }
.stufen button.an[data-s="individuell"] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 55%, transparent); }
:root[data-spalten="3"] { --spalten: 3; }
:root[data-spalten="4"] { --spalten: 4; }
:root[data-spalten="5"] { --spalten: 5; }
:root[data-spalten-kat="3"] { --spalten-kat: 3; }
:root[data-spalten-kat="4"] { --spalten-kat: 4; }
:root[data-spalten-kat="5"] { --spalten-kat: 5; }
/* Kachel öffnet die Seite ihres Bereichs; die Stufenknöpfe wählen nur die Stufe */
.kachel-k { cursor: pointer; }
.kachel-k .stufen { cursor: default; }
/* Stufenwahl passt sich der Kachelbreite an, statt Wörter abzuschneiden */
.kachel-k, .kat-kopf { container-type: inline-size; }
@container (max-width: 330px) { .stufen button { font-size: 12px; gap: 4px; } .stufen button i { width: 6px; height: 6px; } }
@container (max-width: 290px) { .stufen { grid-template-columns: repeat(2, 1fr); } .stufen button { font-size: 12.5px; } }
.stufe-text { font-size: 12px; color: var(--sehrleise); min-height: 1.5em; }
.trennlinie { border: 0; border-top: 1px solid var(--linie); margin: 40px 0 30px; }
.kat-kopf { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 18px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
.kat-kopf p { margin: 0; font-size: 13.5px; color: var(--leise); }

/* --- Dashboard: alles Wichtige auf einen Blick, sehr kompakt ------------- */
.db { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; max-width: 1280px; }
.db-k { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.db-k h3 { overflow-wrap: anywhere; margin: 0 0 10px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--sehrleise); font-weight: 600; }
.db-zahlen { grid-column: span 7; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.db-gross { grid-column: span 5; display: flex; gap: 18px; align-items: center; }
.db-gross .ring { width: 96px; height: 96px; }
.db-gross .ring > span { width: 78px; height: 78px; font-size: 22px; }
.db-gross .zeilen { font-size: 13.5px; color: var(--leise); line-height: 1.55; }
.db-gross .zeilen b { color: var(--text); font-weight: 600; }
.db-zahl { display: flex; flex-direction: column; gap: 4px; cursor: default; }
.db-zahl.klick { cursor: pointer; transition: border-color var(--dauer); }
.db-zahl.klick:hover { border-color: var(--linie-2); }
.db-zahl b { font: 650 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.db-zahl span { font-size: 12.5px; color: var(--leise); }
.db-zahl.warn b { color: var(--rot); }
.db-zahl.offen b { color: var(--akzent); }
.db-bereiche { grid-column: span 8; }
.db-liste { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 22px; }
.db-zeile { display: grid; grid-template-columns: 16px minmax(0, 1fr) 44px 42px 8px; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--leise); }
.db-zeile:hover { background: var(--flaeche-2); color: var(--text); }
.db-zeile .ico { width: 15px; height: 15px; }
.db-zeile .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-zeile .zahl { text-align: right; font-variant-numeric: tabular-nums; color: var(--sehrleise); font-size: 12px; }
.db-zeile .st { width: 8px; height: 8px; border-radius: 50%; }
.db-dienste { grid-column: span 4; display: flex; flex-direction: column; gap: 10px; }
.db-dienst { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--leise); }
.db-dienst i { width: 7px; height: 7px; border-radius: 50%; background: var(--gruen); flex: none; translate: 0 -1px; }
.db-dienst i.aus { background: var(--sehrleise); }
.db-dienst b { color: var(--text); font-weight: 600; min-width: 128px; }
.db-verlauf { grid-column: span 8; padding: 6px 0; }
.db-wieder { grid-column: span 4; display: flex; flex-direction: column; gap: 12px; }
.db-wieder p { margin: 0; font-size: 13px; }
.db-wieder-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
.db-wieder .knopf:disabled { opacity: .4; cursor: not-allowed; }
.db-snaps { display: flex; flex-direction: column; gap: 6px; }
.db-snap { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 13px; }
.db-snap small { display: block; color: var(--sehrleise); font-size: 11.5px; }
.db-verlauf h3 { padding: 10px 18px 0; }
@media (max-width: 1180px) { .db-gross, .db-zahlen { grid-column: span 12; } .db-bereiche, .db-dienste, .db-wieder, .db-verlauf { grid-column: span 12; } }

/* --- Karten der Einstellungen --------------------------------------- */
/* Gewählte Spaltenzahl ist die Höchstzahl: Im schmalen Fenster werden es weniger, damit eine
   Karte nie schmaler als 230 px wird (sonst bricht der Titel nach jedem Wort um). */
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(230px, calc((100% - (var(--spalten, 4) - 1) * var(--abstand)) / var(--spalten, 4))), 1fr)); gap: var(--abstand); }
/* Die gewählte Spaltenzahl gilt immer (Wunsch: „die Anzahl wird erzwungen“).
   Statt Spalten wegzunehmen, werden schmale Karten feiner gesetzt. */
.karte { container-type: inline-size; }
@container (max-width: 250px) {
  .karte-kopf { gap: 10px; }
  .karte-text h3 { font-size: 13.2px; }
  .karte-erkl { font-size: 12.4px; }
  .karte-text .meta { gap: 7px; font-size: 11.2px; }
  .schalter { transform: scale(.88); transform-origin: top right; }
}
@container (max-width: 200px) { .karte-text .meta .mono { display: none; } }
:root[data-ansicht="liste"] .raster { grid-template-columns: 1fr; }
/* Dichte wie in einem Mailprogramm: Kompakt zeigt weniger, Luftig mehr. */
:root[data-dichte="kompakt"] .karte-erkl, :root[data-dichte="kompakt"] .kachel-k p { display: none; }
:root[data-dichte="kompakt"] .karte { gap: 4px; }
:root[data-dichte="kompakt"] .stufe-text { display: none; }
:root[data-dichte="luftig"] .karte-erkl { -webkit-line-clamp: 5; }
:root[data-dichte="luftig"] .kachel-k p { -webkit-line-clamp: 4; min-height: 0; }
:root[data-dichte="luftig"] .karte { gap: 12px; }
.gruppe-titel { grid-column: 1 / -1; margin: 22px 2px 2px; display: flex; align-items: baseline; gap: 10px; }
.gruppe-titel:first-child { margin-top: 0; }
.gruppe-titel h2 { margin: 0; font: 600 15.5px var(--font-display); }
.gruppe-titel span { color: var(--sehrleise); font-size: 12.5px; }
.karte { --farbe: var(--linie-2); position: relative; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: calc(var(--abstand) + 1px) calc(var(--abstand) + 2px) calc(var(--abstand) + 1px) calc(var(--abstand) + 6px);
  display: flex; flex-direction: column; gap: 9px; transition: border-color var(--dauer), box-shadow var(--dauer); animation: rein .3s both; }
.karte::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--farbe); opacity: .85; }
.karte[data-e="Keiner"] { --farbe: var(--gruen); }
.karte[data-e="Leicht"] { --farbe: var(--gelb); }
.karte[data-e="Tief"] { --farbe: var(--rot); }
@keyframes rein { from { transform: translateY(5px); } }
.karte:hover { border-color: var(--linie-2); }
.karte.geaendert { border-color: color-mix(in srgb, var(--akzent) 65%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--akzent) 12%, transparent); }
.karte.nv { opacity: .55; }
.karte-kopf { display: flex; gap: 14px; align-items: flex-start; }
.karte-text { flex: 1; min-width: 0; cursor: pointer; }
.karte-text h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.4; }
.karte-text .meta { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: var(--sehrleise); }
.meta .status-an { color: var(--gruen); }
.meta .status-aus { color: var(--leise); }
.meta .vorgemerkt { color: var(--akzent); }
.sicherheit { color: var(--rot); font-weight: 600; cursor: pointer; border: 0; background: none; padding: 0; font-size: inherit; }
.sicherheit:hover { text-decoration: underline; text-underline-offset: 3px; }
.karte-erkl { color: var(--leise); font-size: 13.2px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.karte.offen-auf .karte-erkl { -webkit-line-clamp: unset; display: block; color: var(--text); }
.details { display: none; flex-direction: column; gap: 10px; font-size: 13px; margin-top: 4px; }
.karte.offen-auf .details { display: flex; }
.box { border-radius: 9px; padding: 10px 12px; background: var(--flaeche-2); border: 1px solid var(--linie); color: var(--leise); }
.box b { color: var(--text); font-weight: 600; }
.box.warnung { border-color: color-mix(in srgb, var(--rot) 45%, transparent); }
.box.warnung b { color: var(--rot); }
.box.hinweis b { color: var(--akzent); }
.code-box { border-radius: 9px; background: var(--bg); border: 1px solid var(--linie); overflow: hidden; }
.code-box .reiter { display: flex; border-bottom: 1px solid var(--linie); }
.code-box .reiter button { flex: none; border: 0; background: none; padding: 7px 12px; font-size: 12px; color: var(--sehrleise); cursor: pointer; border-bottom: 2px solid transparent; }
.code-box .reiter button.an { color: var(--text); border-bottom-color: var(--akzent); }
.code-box .reiter .kopieren { margin-left: auto; color: var(--leise); }
.code-box pre { margin: 0; padding: 11px 12px; font: 12px/1.6 var(--mono); color: #b9c4cf; white-space: pre-wrap; word-break: break-all; }
:root[data-theme="light"] .code-box pre { color: #2b3540; }
.technik { font: 11.8px/1.65 var(--mono); color: var(--sehrleise); word-break: break-all; }
.technik span { color: var(--leise); }
:root[data-technik="aus"] .technik-box { display: none; }
.karte-aktionen { display: flex; gap: 8px; flex-wrap: wrap; }

/* --- Erklärende Einblendung (nur wo ein Begriff sie braucht) --------- */
/* Ein einziges Element, das per Skript am Fensterrand ausgerichtet wird –
   die Einblendung ist immer ganz zu lesen. */
.tipp { position: fixed; left: 0; top: 0; max-width: 300px; padding: 9px 12px; border-radius: 9px; background: var(--flaeche-3); border: 1px solid var(--linie-2);
  color: var(--text); box-shadow: var(--schatten); font: 400 12.5px/1.45 var(--font); pointer-events: none; opacity: 0; transform: translateY(3px);
  transition: opacity .16s, transform .16s; z-index: 60; }
.tipp.zeigt { opacity: 1; transform: none; }

/* --- Schalter mit Augenfleck --------------------------------------- */
.schalter { position: relative; width: 46px; height: 26px; flex: none; margin-top: 1px; }
.schalter input { appearance: none; margin: 0; width: 100%; height: 100%; border-radius: 999px; cursor: pointer; background: var(--flaeche-3); border: 1px solid var(--linie-2); transition: background var(--dauer), border-color var(--dauer); }
.schalter input::after { content: ""; position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: #9aa4ae; transition: transform var(--dauer) cubic-bezier(.3,1.4,.5,1), background var(--dauer); }
.schalter input::before { content: ""; position: absolute; top: 9px; left: 33px; width: 7px; height: 4px; border-radius: 50%; background: var(--orca-weiss); opacity: 0; z-index: 1; transform: rotate(12deg); transition: opacity var(--dauer) .1s; }
.schalter input:checked { background: color-mix(in srgb, var(--akzent) 75%, #0b2030); border-color: transparent; }
.schalter input:checked::after { transform: translateX(20px); background: var(--orca-koerper); }
.schalter input:checked::before { opacity: .95; }
.schalter input:disabled { cursor: not-allowed; opacity: .4; }

/* --- Leiste, Dialog, Schublade, Overlay ----------------------------- */
.leiste { position: fixed; left: calc(50% + 132px); bottom: 24px; translate: -50% 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 9px 9px 9px 18px; border-radius: 14px; background: var(--flaeche-2); border: 1px solid var(--linie-2); box-shadow: var(--schatten); transition: transform var(--dauer), opacity var(--dauer); }
.leiste.weg { transform: translateY(150%); opacity: 0; pointer-events: none; }
.leiste .txt { font-size: 13.5px; white-space: nowrap; color: var(--leise); }
.leiste .txt b { color: var(--text); }
.schleier { position: fixed; inset: 0; z-index: 30; background: rgba(3, 5, 8, .62); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 16px; }
.schleier.auf { display: flex; }
.dialog { width: min(640px, 100%); max-height: 88vh; overflow: auto; background: var(--flaeche); border: 1px solid var(--linie-2); border-radius: calc(var(--radius) + 4px); box-shadow: var(--schatten); padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.dialog h2 { margin: 0; font: 650 19px var(--font-display); }
.dialog p { margin: 0; color: var(--leise); font-size: 13.5px; }
.dialog .knoepfe { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.vorschau-gruppe h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--leise); text-transform: uppercase; letter-spacing: 1px; }
.vorschau-gruppe ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.vorschau-gruppe li { display: flex; gap: 10px; align-items: baseline; font-size: 13.2px; }
.vorschau-gruppe li .mono { color: var(--sehrleise); font-size: 11.5px; flex: none; width: 58px; }
.vorschau-gruppe li .flags { margin-left: auto; font-size: 11.5px; color: var(--sehrleise); white-space: nowrap; }
.schublade { position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(390px, 100%); background: var(--flaeche); border-left: 1px solid var(--linie-2); box-shadow: var(--schatten); padding: 24px; overflow: auto; transform: translateX(105%); transition: transform var(--dauer); display: flex; flex-direction: column; gap: 20px; }
.schublade.auf { transform: none; }
.schublade h2 { margin: 0; font: 650 19px var(--font-display); }
.feld { display: flex; flex-direction: column; gap: 8px; }
.feld > label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--sehrleise); font-weight: 600; }
.segment { display: flex; border: 1px solid var(--linie); border-radius: 10px; overflow: hidden; background: var(--flaeche-2); }
.segment button { flex: 1; border: 0; background: none; padding: 8px 6px; cursor: pointer; font-size: 12.5px; color: var(--leise); }
.segment button + button { border-left: 1px solid var(--linie); }
.segment button.an { background: var(--flaeche-3); color: var(--text); font-weight: 600; }
.feld .feld-hinweis { font-size: 11.5px; color: var(--sehrleise); margin-top: -2px; }
.farben { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.farbe { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--flaeche); cursor: pointer; outline: 1px solid var(--linie-2); }
.farbe.an { outline: 2px solid var(--text); }
.farben input[type=color] { width: 30px; height: 30px; border: 0; background: none; padding: 0; cursor: pointer; }
input[type=range] { accent-color: var(--akzent); width: 100%; }
.knopf:disabled { opacity: .4; cursor: not-allowed; }
.eingabe { width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche); color: inherit; font: inherit; outline: none; }
.eingabe:focus { border-color: color-mix(in srgb, var(--akzent) 60%, var(--linie)); }

.overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
.overlay.auf { display: flex; }
.bestand { width: min(620px, 100%); display: flex; flex-direction: column; gap: 22px; }
.bestand .orca-gross { width: 170px; height: 90px; align-self: center; }
.bestand .orca-gross svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--akzent) 50%, transparent)); animation: schwimmen 3.4s ease-in-out infinite; }
@keyframes schwimmen { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.bestand h2 { margin: 0; text-align: center; font: 650 22px var(--font-display); }
.bestand p { margin: 0; text-align: center; color: var(--leise); font-size: 14px; }
.scan { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow: auto; padding-right: 14px; scrollbar-gutter: stable; }
.scan-zeile { display: grid; grid-template-columns: 1fr 160px 70px; gap: 14px; align-items: center; font-size: 13px; color: var(--leise); opacity: 0; transition: opacity .3s; }
.scan-zeile.da { opacity: 1; }
.mess-fortschritt { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.mess-fortschritt .balken { width: min(420px, 100%); height: 4px; }
.mess-fortschritt .balken i { transition: width .35s ease-out; }
.mess-fortschritt span { font-size: 12.5px; color: var(--sehrleise); font-variant-numeric: tabular-nums; }
.fehlertext { color: var(--rot) !important; }
.abschluss { display: flex; gap: 16px; align-items: center; }
/* Intro: ruhig, ein Schritt nach dem anderen; der Orca schwimmt mit */
.intro { width: min(620px, 100%); display: flex; flex-direction: column; gap: 22px; }
.intro-meer { position: relative; height: 70px; border-bottom: 1px solid var(--linie); }
.intro-orca { position: absolute; bottom: 8px; width: 110px; height: 58px; transition: left .9s cubic-bezier(.4, .1, .2, 1); }
.intro-orca svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--akzent) 45%, transparent)); animation: schwimmen 3.4s ease-in-out infinite; }
.intro-schritt { display: flex; flex-direction: column; gap: 10px; min-height: 190px; animation: rein .35s both; }
.intro-schritt h2 { margin: 0; font: 650 24px var(--font-display); }
.intro-schritt p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text); }
.intro-schritt p.leise, .intro-schritt span.leise { color: var(--leise); font-size: 13px; }
.intro-punkte { display: flex; gap: 8px; justify-content: center; }
.intro-punkte i { width: 7px; height: 7px; border-radius: 50%; background: var(--linie-2); transition: background var(--dauer), width var(--dauer); }
.intro-punkte i.an { background: var(--akzent); width: 20px; border-radius: 4px; }
.intro-knoepfe { display: flex; gap: 10px; align-items: center; }
/* Profile: jede Zeile in ihrer Farbe; das aktive bzw. ausgewählte Profil leuchtet */
.zeile-k.profil { position: relative; overflow: hidden; }
.profil-farbe { width: 10px; height: 10px; border-radius: 50%; background: var(--pf); flex: none; }
.zeile-k.profil.aktiv, .zeile-k.profil.ausgewaehlt { border-color: color-mix(in srgb, var(--pf) 70%, transparent); background: color-mix(in srgb, var(--pf) 9%, var(--flaeche)); }
.zeile-k.profil.aktiv { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pf) 18%, transparent); }
.zeile-k.profil.aktiv b, .zeile-k.profil.ausgewaehlt b { color: var(--pf); }
.profil-marke { margin-left: 8px; font-size: 11.5px; font-weight: 600; color: var(--pf); }
.profil-waehler { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
.muell { border: 1px solid color-mix(in srgb, var(--rot) 40%, transparent); background: transparent; color: var(--rot); border-radius: 9px; width: 34px; height: 32px; display: grid; place-items: center; cursor: pointer; transition: background var(--dauer); }
.muell:hover { background: color-mix(in srgb, var(--rot) 14%, transparent); }
.muell svg { width: 16px; height: 16px; }
.link-knopf { border: 0; background: none; padding: 0; color: var(--akzent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
/* Über-Seite: ein Orca im Hintergrund, der fröhlich Wasser durch sein Blasloch bläst */
.seite { position: relative; }
.ueber-orca { position: relative; margin: 70px 8% 90px auto; width: 220px; height: 116px; opacity: .65; pointer-events: none; animation: schwimmen 4.5s ease-in-out infinite; }
.ueber-orca svg { width: 100%; height: 100%; }
.ueber-orca .blas { position: absolute; left: 71%; top: 36%; width: 2px; height: 2px; }
/* Fontäne: jeder Tropfen steigt senkrecht auf, öffnet sich oben zur Seite und fällt zurück; danach Pause */
.ueber-orca .blas i { position: absolute; width: 7px; height: 7px; border-radius: 2px; background: color-mix(in srgb, var(--akzent) 75%, white); opacity: 0;
  --s: mod(var(--i) * 5, 7); --h: calc(-34px - var(--s) * 10px); --x: calc((var(--i) - 6) * 3.2px * (.5 + var(--s) * .18));
  animation: blasen 3.6s cubic-bezier(.2,.7,.4,1) infinite; animation-delay: calc(var(--i) * .012s); }
@keyframes blasen {
  0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
  6%   { opacity: 1; }
  28%  { opacity: 1; transform: translate(calc(var(--x) * .35), var(--h)) scale(1); }
  48%  { opacity: .7; transform: translate(var(--x), calc(var(--h) * .55)) scale(.9); }
  60%  { opacity: 0; transform: translate(calc(var(--x) * 1.25), calc(var(--h) * .25)) scale(.7); }
  100% { opacity: 0; transform: translate(calc(var(--x) * 1.25), calc(var(--h) * .25)) scale(.7); }
}
.seite > .box, .seite > div:not(.ueber-orca) { position: relative; z-index: 1; }
.box.macher { display: flex; gap: 18px; align-items: center; }
.macher b { font-size: 15px; }
.kontakte { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.kontakte .mono { color: var(--text); }
.orca-gross.klein { width: 84px; height: 44px; flex: none; }
.orca-gross.klein svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--akzent) 45%, transparent)); animation: schwimmen 3.4s ease-in-out infinite; }
.dialog .code-box pre { max-height: 220px; overflow: auto; }
.sim-hinweis { font-size: 12px; color: var(--gelb); border: 1px solid color-mix(in srgb, var(--gelb) 45%, transparent); background: color-mix(in srgb, var(--gelb) 10%, transparent); border-radius: 8px; padding: 4px 10px; }

      return bruecke("ablage", { art: ABLAGE[key], liste: alt }).then(n => { ablageStand[key] = n; weg(); protokoll("ablage", `${n.length} ${ABLAGE[key]} aus dem Browser-Speicher übernommen`); });
    ablageStand[key] = l; weg();
  }).catch(e => { ablageStand[key] = []; protokoll("fehler", `Ablage ${ABLAGE[key]} lesen: ${e.message}`); toast(e.message); });
}

function gehe(art, wert = null) {

function setzeKopf(titel, unter, mitFilter) {
  document.getElementById("titel").firstChild.nodeValue = titel;
  document.getElementById("untertitel").textContent = unter || "";
  document.getElementById("filterLeiste").style.display = mitFilter ? "" : "none";
}

function render() {
  markiereNav();
  const s = document.getElementById("seite");
  if (!D) {
    setzeKopf("Keine Messdaten", "", false);
    s.innerHTML = `<div class="leer"><div class="mini-orca">${orcaSvg()}</div>Die Datei <b>orca-daten.js</b> fehlt neben dieser Seite.<br>Erzeugen mit Werkzeuge\\Gui-Daten.ps1</div>`;
    return;
  }

    waechter: renderWaechter, apps: renderApps, kennung: renderKennung, schnapp: renderSchnapp, profile: renderProfile, verlauf: renderVerlauf, bekannt: renderBekannt, ueber: renderUeber };

function stufenKnoepfe(st) {
  return `<div class="stufen">${["gruen", "gelb", "rot", "individuell"].map(s => `<button data-s="${s}" class="${st === s ? "an" : ""}">${s === "individuell" ? "" : `<i style="background:var(--${s})"></i>`}${t(s)}</button>`).join("")}</div>`;

const STUFE_TIPP = {"gruen": "Basis: die wichtigsten Abschaltungen, ohne Nebenwirkungen.", "gelb": "Erweitert: alles, was ohne spürbare Nachteile geht – die Empfehlung.", "rot": "Maximal: zusätzlich Einstellungen mit spürbarer Folge, etwa ohne Liste zuletzt verwendeter Dateien oder ohne Ordnerzugriff für Apps. Sicherheitsrisiken sind nie enthalten."};

const EINSEITER = ["dashboard", "uebersicht", "alle"];
const istEinseiter = () => EINSEITER.includes(ansicht.art);
const ABSCHNITT_KOPF = {

};

function renderEinseiter() {

  seite.innerHTML = `<section id="abs-dashboard" data-abschnitt="dashboard">${dashboardHtml()}</section>

}

// Seitenleiste und Kopfzeile folgen dem Bildlauf.
function folgeScroll() {
  if (!istEinseiter()) return;
  const inhalt = document.getElementById("inhalt");
  const oben = inhalt.getBoundingClientRect().top + 90;
  let abschnitt = "dashboard";
  document.querySelectorAll("#seite [data-abschnitt]").forEach(s => { if (s.getBoundingClientRect().top <= oben) abschnitt = s.dataset.abschnitt; });
  if (abschnitt !== folgeScroll.letzter) { protokoll("scroll", "Abschnitt " + abschnitt); folgeScroll.letzter = abschnitt; }
  markiereNav(abschnitt, null);
  const [titel, unter] = ABSCHNITT_KOPF[abschnitt]();
  setzeKopf(titel, unter, false);
}

// Zu einem der drei Abschnitte springen (zeigt die Startseite, falls nötig).
function springe(art) {
  const war = istEinseiter();
  ansicht = { art, wert: null };
  if (!war) render();
  const ziel = document.getElementById("abs-" + art), inhalt = document.getElementById("inhalt");
  if (!ziel) return;
  const y = ziel.getBoundingClientRect().top - inhalt.getBoundingClientRect().top + inhalt.scrollTop - (art === "dashboard" ? 28 : 18);
  inhalt.scrollTo({ top: Math.max(0, y), behavior: war && opt.bewegung !== "aus" ? "smooth" : "auto" });
  setTimeout(folgeScroll, war ? 450 : 0);
}

function kategorienHtml() {
  const zurueck = letzteZurueckgestellt();

  }
  html += `<div class="abschnitt"><h2>${t("uebersicht")}</h2><span class="leise">Schutzstufe je Bereich wählen – Klick auf eine Kachel zeigt ihre Einstellungen</span></div>

      ${stufenKnoepfe(st)}
      <div class="stufe-text">${esc(stufenText(k.name, st))}</div>
    </div>`;
  }
  return html + "</div>";
}

    <div class="db-k db-zahl klick" id="dbNv"><h3>Nicht verfügbar</h3><b>${nv}</b><span>auf diesem Gerät</span></div></div>

function verbindeDashboard() {

function verbindeStufen(el, kat, vomDashboard) {
  const txt = el.querySelector(".stufe-text");

    b.addEventListener("mouseenter", () => { txt.textContent = stufenText(kat, b.dataset.s); });

      toast(`${katName(kat)}: Stufe ${t(b.dataset.s)} ausgewählt`);

// --- Liste aller oder einer Kategorie -----------------------------------
function baueFilter(liste, zielId = "filterLeiste", neu = render) {
  const z = {
    alle: liste.length,
    an: liste.filter(p => bedienbar(p) && istAn(p)).length,
    aus: liste.filter(p => bedienbar(p) && !istAn(p)).length,
    gruen: liste.filter(p => stufenFarbe(p) === "Keiner").length,
    gelb: liste.filter(p => stufenFarbe(p) === "Leicht").length,
    rot: liste.filter(p => stufenFarbe(p) === "Tief").length,
    sicherheit: liste.filter(p => p.senktSchutz).length,
    nv: liste.filter(p => !bedienbar(p)).length,
  };
  const chip = (f, txt, extra = "") => `<button class="chip ${filter === f ? "an" : ""}" data-filter="${f}">${extra}${txt}<span class="n">${z[f]}</span></button>`; // txt ist eigener, fester Text
  document.getElementById(zielId).innerHTML =
    chip("alle", "Alle") + chip("an", "Aktiv") + chip("aus", "Inaktiv") +
    chip("gruen", "Basis", '<span class="punkt" style="background:var(--gruen)"></span>') +
    chip("gelb", "Erweitert", '<span class="punkt" style="background:var(--gelb)"></span>') +
    chip("rot", "Maximal", '<span class="punkt" style="background:var(--rot)"></span>') +
    chip("sicherheit", '<span style="color:var(--rot)">⚠ Sicherheitsrisiko</span>') + chip("nv", "Nicht verfügbar");
  document.querySelectorAll(`#${zielId} [data-filter]`).forEach(c => c.addEventListener("click", () => { filter = c.dataset.filter; neu(); }));
}
function passt(p) {
  const f = {
    an: bedienbar(p) && istAn(p), aus: bedienbar(p) && !istAn(p), gruen: stufenFarbe(p) === "Keiner", gelb: stufenFarbe(p) === "Leicht",
    rot: stufenFarbe(p) === "Tief", sicherheit: p.senktSchutz, nv: !bedienbar(p),
  };
  if (filter !== "alle" && !f[filter]) return false;
  if (suchtext) {
    let h = p.id + " " + p.name + " " + p.erklaerung + " " + p.hinweis + " " + katName(p.kategorie);
    // Auf Englisch auch in der englischen Fassung suchen
    if (SP === "en") h += " " + [p.name, p.erklaerung, p.hinweis, katName(p.kategorie)].map(UEB.en).join(" ");
    h = h.toLowerCase();
    if (!suchtext.split(/\s+/).every(w => h.includes(w))) return false;
  }
  return true;
}
function renderListe(kat) {
  const liste = kat ? PUNKTE.filter(p => p.kategorie === kat) : PUNKTE;
  const an = liste.filter(p => bedienbar(p) && istAn(p)).length, b = liste.filter(bedienbar).length;
  setzeKopf(kat ? katName(kat) : "Alle Einstellungen", `${liste.length} Einstellungen · ${an} von ${b} aktiv`, true);
  baueFilter(liste);
  let html = "";
  if (kat && kat !== "Experimentell") {
    const st = stufeDerKategorie(kat);
    html += `<div class="kat-kopf" data-kat="${esc(kat)}"><p>${esc(KAT[kat]?.erklaerung || "")}</p>${stufenKnoepfe(st)}<div class="stufe-text">${esc(stufenText(kat, st))}</div></div>`;
  }
  if (kat === "Experimentell") {
    html += `<div class="kat-kopf"><p>${esc(KAT.Experimentell?.erklaerung || "")}</p><p>Diese Einstellungen gehören zu keinem Profil und keiner Schutzstufe. Jede zeigt unter „Technische Angaben“ den gemessenen Wert (Ist) und den Sollwert – vorher und nach dem Anwenden. Ob der Rechner dadurch spürbar schneller wird, hängt vom Gerät ab.</p></div>`;
  }
  html += `<div class="raster">${kartenHtml(liste.filter(passt), !kat)}</div>`;
  document.getElementById("seite").innerHTML = html;
  const kk = document.querySelector(".kat-kopf[data-kat]");
  if (kk) verbindeStufen(kk, kat, false);
  verbindeKarten();
}

function kartenHtml(liste, gruppiert) {
  if (!liste.length) return `<div class="leer"><div class="mini-orca">${orcaSvg()}</div>Hier schwimmt nichts.</div>`;
  let html = "", letzte = null;
  for (const p of liste) {
    if (gruppiert && p.kategorie !== letzte) {
      html += `<div class="gruppe-titel"><h2>${esc(katName(p.kategorie))}</h2><span>${liste.filter(x => x.kategorie === p.kategorie).length}</span></div>`;
      letzte = p.kategorie;
    }
    html += karte(p);
  }
  return html;
}
function karte(p) {
  const an = istAn(p), geaendert = vorgemerkt.has(p.id), ok = bedienbar(p);
  const status = !ok ? `<span data-tip="${esc(nichtVerfuegbarGrund(p))}">Nicht verfügbar</span>` : an ? '<span class="status-an">Aktiv</span>' : '<span class="status-aus">Inaktiv</span>';

// Zustand eines Profils: "aktiv" (so ist der Rechner eingestellt), "ausgewaehlt"

function profilZustand(passt) {
  const gemessen = PUNKTE.filter(bedienbar).every(p => passt(p, p.status === "Erfuellt"));
  if (gemessen && !vorgemerkt.size) return "aktiv";
  return PUNKTE.filter(bedienbar).every(p => passt(p, istAn(p))) ? "ausgewaehlt" : "";
}
function festZustand(pr) {
  const kats = new Set(KATS.filter(k => k.name !== "Experimentell").map(k => k.name));
  return profilZustand((p, an) => !kats.has(p.kategorie) || !empfohlen(p) || an === gehoertZu(p, pr.stufe));
}
function eigenZustand(pr) { return profilZustand((p, an) => !(p.id in pr.zustand) || an === pr.zustand[p.id]); }
function profilZeile(name, text, farbe, zustand, knoepfe) {
  const marke = zustand === "aktiv" ? "aktiv" : zustand === "ausgewaehlt" ? "ausgewählt – noch nicht angewendet" : "";
  return `<div class="zeile-k profil ${zustand}" style="--pf:${farbe}"><i class="profil-farbe"></i><div class="mitte"><b>${esc(name)}</b>${marke ? `<span class="profil-marke">${marke}</span>` : ""}<div>${esc(text)}</div></div>${knoepfe}</div>`;
}

// Im Programm läuft dabei die echte Messung: oben der Fortschritt (wie eine
// Echoortung, die Bereich für Bereich abtastet), danach das Ergebnis je Bereich.
function bestandsaufnahmeStart() {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="bestand"><div class="orca-gross">${orcaSvg()}</div><h2>Bestandsaufnahme</h2>
    <p>Der aktuelle Zustand des Systems wird ermittelt. Es wird nichts verändert.</p>
    <div class="mess-fortschritt" id="messFortschritt"><div class="balken"><i id="messBalken" style="width:2%"></i></div><span id="messText">Engine wird gestartet …</span></div>
    <div class="scan" id="scan"></div>
    <div style="display:flex;justify-content:center"><button class="knopf voll" id="btnBestandOk" style="visibility:hidden">Weiter</button></div></div>`;
  o.classList.add("auf");
  return {
    fortschritt(prozent, text) {
      document.getElementById("messBalken").style.width = Math.max(2, prozent) + "%";
      document.getElementById("messText").textContent = `${katName(text) || text || "Messung"} · ${prozent} %`;
    },
    fertig() { document.getElementById("messFortschritt").remove(); bestandsaufnahme(true); },
    fehler(text) { document.getElementById("messText").textContent = text; document.getElementById("messText").classList.add("fehlertext"); },
  };
}
function bestandsaufnahme(schonOffen = false) {
  const o = document.getElementById("overlay");
  if (!schonOffen) {
    o.innerHTML = `<div class="bestand"><div class="orca-gross">${orcaSvg()}</div><h2>Bestandsaufnahme</h2>
      <p>Der aktuelle Zustand des Systems wird ermittelt. Es wird nichts verändert.</p><div class="scan" id="scan"></div>
      <div style="display:flex;justify-content:center"><button class="knopf voll" id="btnBestandOk" style="visibility:hidden">Weiter</button></div></div>`;
    o.classList.add("auf");
  }
  const scan = document.getElementById("scan");
  const kats = KATS.filter(k => k.name !== "Experimentell");
  kats.forEach((k, i) => {
    const l = PUNKTE.filter(p => p.kategorie === k.name && bedienbar(p)), an = l.filter(p => p.status === "Erfuellt").length;
    const z = document.createElement("div"); z.className = "scan-zeile";

  });
  setTimeout(() => { document.getElementById("btnBestandOk").style.visibility = "visible"; }, 140 * kats.length + 500);
  document.getElementById("btnBestandOk").addEventListener("click", () => { o.classList.remove("auf"); speichern("orca-erststart", true); });
}

  for (const [n, v] of assistentVorgemerkt) {

    else skript += `\n# Herunterfahren-Assistent ${v ? "eintragen" : "austragen"} – über OrcaShield (lokale Gruppenrichtlinie)\n`;
  }
  if (wAus.length || wAn.length) skript += `\n# Prüfbereiche des Wächters – OrcaShield vermerkt sie in seiner Zustandsdatei${wAus.length ? "\n#   ausschalten: " + wAus.join(", ") : ""}${wAn.length ? "\n#   einschalten: " + wAn.join(", ") : ""}\n`;
  const ers = ein.filter(p => p.senktSchutz).length, sperr = ein.filter(p => p.grautAus).length, ns = [...ein, ...aus].filter(neustart).length;

(function () {
  const tipp = document.getElementById("tipp");
  let ziel = null, uhr = null;
  const weg = () => { clearTimeout(uhr); ziel = null; tipp.classList.remove("zeigt"); };
  function zeige(el) {
    tipp.textContent = el.dataset.tip;
    tipp.style.left = "0px"; tipp.style.top = "0px";
    const r = el.getBoundingClientRect(), b = tipp.getBoundingClientRect(), rand = 10;
    let x = r.left + r.width / 2 - b.width / 2;
    x = Math.max(rand, Math.min(x, window.innerWidth - b.width - rand));
    let y = r.top - b.height - 8;
    if (el.hasAttribute("data-tip-unten") || y < rand) y = r.bottom + 8;
    if (y + b.height > window.innerHeight - rand) y = Math.max(rand, r.top - b.height - 8);
    tipp.style.left = x + "px"; tipp.style.top = y + "px";
    tipp.classList.add("zeigt");
  }
  document.addEventListener("mouseover", e => {
    const el = e.target.closest("[data-tip]");
    if (el === ziel) return;
    weg();
    if (!el || !el.dataset.tip) return;
    ziel = el; uhr = setTimeout(() => { if (ziel === el) zeige(el); }, 450);
  });
  document.addEventListener("mousedown", weg, true);
  document.addEventListener("scroll", weg, true);
  window.addEventListener("blur", weg);
})();

    bereicheAn: [...waechterVorgemerkt].filter(([, v]) => v).map(([k]) => k),

  const mitAuto = !!(auto.waechter || auto.bereinigung || auto.schattenkopien || auto.bereicheAus.length || auto.bereicheAn.length);

  protokoll("anwenden", `${SIMULATION ? "Simulation" : "echt"} · ein: ${ein.join(", ") || "–"} · zurück: ${aus.join(", ") || "–"}` + (mitAuto ? ` · Automatik: ${JSON.stringify(auto)}` : ""));

  };
  let erg = { simulation: SIMULATION, punkte: [], vorgaenge: [] };
  try {
    erg = await bruecke("anwenden", mitAuto ? { ein, aus, automatik: auto } : { ein, aus }, fort);
    if (!erg.abgebrochen && erg.automatikAbgebrochen) erg.punkte = [...(erg.punkte || []), ...["waechter", "herunterfahren", "schattenkopien"].filter(n => assistentVorgemerkt.has(n)).concat([...waechterVorgemerkt.keys()].map(k => "bereich:" + k))
      .map(id => ({ id, richtung: "", ok: false, status: "Fehler", grund: erg.automatikAbgebrochen }))];

  if (erg.abgebrochen) {

    if (r.id in AUTO_TITEL) assistentVorgemerkt.delete(r.id);

  const sim = erg.simulation;
  const vorg = (erg.vorgaenge || []).map(v => `${v.art.padEnd(16)} ${v.ziel}${v.wert ? "  =  " + v.wert : ""}`).join("\n");
  // Stand danach (7.7): empfohlene Einstellungen mit dem Ergebnis dieses Laufs, ohne auf die Neumessung zu warten
  const ergebnis = new Map(gut.filter(r => PUNKTE.some(p => p.id === r.id)).map(r => [r.id, r.richtung !== "aus"]));
  const empfListe = PUNKTE.filter(p => bedienbar(p) && empfohlen(p));
  const empfAn = empfListe.filter(p => ergebnis.has(p.id) ? ergebnis.get(p.id) : p.status === "Erfuellt").length;
  const waechterHaelt = !sim && D.installiert && automatikIst("waechter");
  // Erledigte Vormerkungen entfernen (fehlgeschlagene bleiben vorgemerkt)
  for (const r of gut) vorgemerkt.delete(r.id);
  zeigeDialog(`<h2>${sim ? "Simulation abgeschlossen" : schlecht.length ? "Angewendet – mit Hinweisen" : "Geschafft"}</h2>
    <div class="abschluss"><div class="orca-gross klein">${orcaSvg()}</div>
      <p>${sim ? "Es wurde <b>nichts</b> am System verändert. So wäre es gelaufen:" : "Jede Einstellung wurde gesetzt und danach nachgeprüft."}</p></div>
    <div class="box"><b>${gut.length}</b> von ${punkte.length} ${sim ? "würden erfolgreich gesetzt" : "erfolgreich"}${schlecht.length ? ` · <b style="color:var(--rot)">${schlecht.length}</b> nicht` : ""}.
      <br>${sim ? "Danach wären" : "Jetzt sind"} <b>${empfAn} von ${empfListe.length}</b> empfohlenen Einstellungen aktiv.${waechterHaelt ? " Der Wächter hält sie bei jeder Anmeldung." : ""}</div>
    ${schlecht.length ? `<div class="vorschau-gruppe"><h3>Nicht gelungen · ${schlecht.length}</h3><ul>${schlecht.map(zeile).join("")}</ul></div>` : ""}
    ${gut.length ? `<div class="vorschau-gruppe"><h3>${sim ? "Würde gelingen" : "Gelungen"} · ${gut.length}</h3><ul>${gut.map(zeile).join("")}</ul></div>` : ""}
    ${sim && vorg ? `<div class="code-box"><div class="reiter"><button class="an">Was geschrieben worden wäre</button><button class="kopieren" data-a="kopieren">Kopieren</button></div><pre>${esc(vorg)}</pre></div>` : ""}
    <div class="knoepfe"><button class="knopf voll" data-a="ok">Fertig</button></div>`,
    a => { if (a === "kopieren") kopiere(vorg); neuMessen(); });
  // Orca-Moment: großer Sprung, wenn alles geklappt hat
  if (!schlecht.length) { const l = document.getElementById("logoOrca"); l.classList.remove("sprung", "hopser"); void l.offsetWidth; l.classList.add("sprung"); }
}

// Messstatus oben rechts (während im Hintergrund neu gemessen wird)
function messStatus(text) {

// Im Programm: neu messen. Die zuletzt gemessenen Daten bleiben bis dahin sichtbar.
async function neuMessen(vonHand = false) {
  if (neuMessen.laeuft) return;
  neuMessen.laeuft = true;
  messStatus("misst …");
  const t0 = Date.now(); protokoll("messung", "neu messen" + (vonHand ? " (von Hand)" : ""));
  try {
    const d = await bruecke("messen", {}, f => messStatus(`misst … ${f.prozent} %`));
    datenUebernehmen(d);
    protokoll("messung", `fertig in ${((Date.now() - t0) / 1000).toFixed(1)} s · ${PUNKTE.length} Punkte · ${PUNKTE.filter(p => p.status === "Erfuellt").length} erfüllt`);
    kopfDaten(); aktualisiere();
    if (vonHand) toast("Neu gemessen");
  } catch (e) { protokoll("fehler", "Messung: " + e.message); toast("Messung fehlgeschlagen: " + e.message); }
  finally { neuMessen.laeuft = false; messStatus(null); }
}
async function starteApp() {

  // Bei jedem Start: Bestandsaufnahme mit Ergebnis je Bereich, mit „Weiter“ bestätigen.
  // Die Messung beginnt sofort – beim ersten Start läuft währenddessen das Intro.
  let anzeige = null, letzter = null;
  const t0 = Date.now();
  protokoll("start", `Oberfläche ${SEITEN_VERSION} · ${innerWidth}×${innerHeight} · ${navigator.language}`);
  const ablage = Promise.all(Object.keys(ABLAGE).map(ablageLaden));
  const messung = bruecke("messen", {}, f => { letzter = f; if (anzeige) anzeige.fortschritt(f.prozent, f.text); });
  messung.then(() => protokoll("messung", `Bestandsaufnahme fertig in ${((Date.now() - t0) / 1000).toFixed(1)} s`),
               e => protokoll("fehler", "Bestandsaufnahme: " + e.message));
  if (!laden("orca-intro", false)) { await intro(); speichern("orca-intro", true); }
  anzeige = bestandsaufnahmeStart();
  if (letzter) anzeige.fortschritt(letzter.prozent, letzter.text);

  { titel: "Erst messen", text: "Bei jedem Start schaut OrcaShield nach, wie dein Windows gerade eingestellt ist – Bereich für Bereich. Dabei wird nichts verändert.", klein: "Die Bestandsaufnahme zeigt dir danach, wo du stehst." },
  { titel: "Dann wählen", text: "Für jeden Bereich wählst du eine Schutzstufe – Basis, Erweitert oder Maximal – oder legst jede Einstellung einzeln fest. Die Farben zeigen die Stufe: grün Basis, gelb Erweitert, rot Maximal – je höher, desto mehr Einstellungen mit spürbarer Folge.", klein: "⚠ Sicherheitsrisiken gehören zu keiner Stufe und lassen sich nur einzeln und mit Warnung aktivieren." },
  { titel: "Prüfen & anwenden", text: "Bevor etwas geändert wird, siehst du jede Änderung samt PowerShell-Befehl. Vorher sichert OrcaShield den Ausgangszustand – du kannst jederzeit zurück. Auf Wunsch hält der Wächter deine Einstellungen, wenn Windows sie verstellt.", klein: "Danach zeigt dir ein Abschluss, was gelungen ist – und was nicht, mit Grund." },
];
function intro() {
  return new Promise(fertig => {
    const o = document.getElementById("overlay");
    let i = 0;
    const zeige = () => {
      const s = INTRO[i], letzter = i === INTRO.length - 1;
      o.innerHTML = `<div class="intro">
        <div class="intro-meer"><div class="intro-orca" style="left:${8 + i * 26}%">${orcaSvg()}</div></div>
        <div class="intro-schritt"><span class="leise">${i + 1} von ${INTRO.length}</span><h2>${esc(s.titel)}</h2><p>${esc(s.text)}</p><p class="leise">${esc(s.klein)}</p></div>
        <div class="intro-punkte">${INTRO.map((_, k) => `<i class="${k === i ? "an" : ""}"></i>`).join("")}</div>
        <div class="intro-knoepfe"><button class="knopf still" id="introWeg">${letzter ? "" : "Überspringen"}</button>
          <span style="flex:1"></span>${i ? '<button class="knopf still" id="introZurueck">Zurück</button>' : ""}
          <button class="knopf voll" id="introWeiter">${letzter ? "Los geht’s" : "Weiter"}</button></div></div>`;
      o.classList.add("auf");
      const ende = () => { o.classList.remove("auf"); fertig(); };
      document.getElementById("introWeiter").addEventListener("click", () => { if (letzter) ende(); else { i++; zeige(); } });
      const z = document.getElementById("introZurueck"); if (z) z.addEventListener("click", () => { i--; zeige(); });
      const w = document.getElementById("introWeg"); if (w && !letzter) w.addEventListener("click", ende); else if (w) w.style.visibility = "hidden";
      document.getElementById("introWeiter").focus();
    };
    zeige();
  });
}

wendeAn();
if (APP) starteApp();
else {
  kopfDaten();
  if (D) { baueNav(); aktualisiereRing(); }
  const startSeite = D && ADRESSE.get("seite");
  if (startSeite) ansicht = KAT[startSeite] ? { art: "kategorie", wert: startSeite } : { art: startSeite, wert: null };
  render();
  // Direktaufruf eines Abschnitts der Startseite (?seite=alle, ?seite=Telemetrie …): dorthin springen
  if (D && startSeite && istEinseiter()) springe(ansicht.art);
  if (D && !laden("orca-erststart", false) && !vorschauThema && !vorschauSprache) bestandsaufnahme();
  // Prüfhilfe für die englische Fassung (nur Browser-Entwurf, ?sprache=en&pruefen=1):
  // listet sichtbare Texte, die noch deutsch aussehen, am Ende der Seite auf.
  if (vorschauSprache === "en" && ADRESSE.get("pruefen")) setTimeout(() => {
    const rest = new Set(), w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const deutsch = /[äöüÄÖÜß]|\b(und|der|die|das|nicht|wird|werden|ist|mit|auf|für|bei|noch|keine?|alle|Einstellung\w*)\b/;
    for (let n; (n = w.nextNode());) if (!n.parentElement.closest("pre, code, script, style") && deutsch.test(n.nodeValue)) rest.add(n.nodeValue.trim());
    for (const el of document.querySelectorAll("[title], [data-tip], [placeholder]")) for (const a of ["title", "data-tip", "placeholder"]) if (el.getAttribute(a) && deutsch.test(el.getAttribute(a))) rest.add("@" + a + ": " + el.getAttribute(a));
    const p = document.createElement("pre"); p.id = "fehltEn"; p.hidden = true; p.textContent = [...rest].join("\n"); document.body.appendChild(p);
  }, 1500);
}
